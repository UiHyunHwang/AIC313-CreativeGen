<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이언맨 · 스파이더맨 · 캡틴 아메리카</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111419;color:#f4f0e6;font-family:Inter,system-ui,sans-serif}main{max-width:920px;margin:auto;padding:12px}header,nav,footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:18px;font-weight:600}button,select{background:#222932;border:1px solid #626975;color:inherit;border-radius:5px;padding:7px 10px;font:inherit}button{cursor:pointer}canvas{display:block;width:min(100%,calc(100vh - 155px));max-width:100%;margin:9px auto;aspect-ratio:1;touch-action:none;cursor:grab;background:#222}input{flex:1;min-width:90px;accent-color:#f6b56f}output{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}footer{font-size:13px;color:#b8c3ce;margin-top:9px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffc37a}
</style>
<main><header><h1>아이언맨 · 스파이더맨 · 캡틴 아메리카</h1><label>안쪽 격자 <select id="grid"><option value="8">8 × 8</option><option value="16">16 × 16</option></select></label></header>
<canvas id="view" width="1024" height="1024" aria-label="아이언맨에서 캡틴 아메리카까지 이어지는 확대 보기"></canvas>
<nav><button id="iron">아이언맨</button><button id="spider">스파이더맨</button><button id="cap">캡틴 아메리카</button><label for="zoom">배율</label><input id="zoom" type="range" min="0" max="7" step="0.005" value="0"><output id="factor">1×</output></nav><footer>슬라이더로 선택한 타일을 따라 확대할 수 있습니다. 화면을 드래그하면 주변 타일을 볼 수 있습니다.</footer></main>
<script id="assets" type="application/json">__ASSETS__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("assets").textContent);
const elem=id=>document.getElementById(id), canvas=elem("view"), ctx=canvas.getContext("2d");
const slider=elem("zoom"), grid=elem("grid"), cache=new Map();
let size=8,z=1,cx=.5,cy=.5,frame=0,travel=0,drag=null;
const clip=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const requestDraw=()=>{if(!frame)frame=requestAnimationFrame(draw)};
function image(key,bytes){
  if(!cache.has(key)){
    if(cache.size>=128){
      const discard=[...cache.keys()].find(id=>id.includes("/")&&cache.get(id).complete);
      if(discard!==undefined)cache.delete(discard);
    }
    const img=new Image();cache.set(key,img);img.onload=requestDraw;
    img.src="data:image/jpeg;base64,"+bytes;
  }
  const img=cache.get(key);return img.complete&&img.naturalWidth?img:null;
}
function drawLayer(name,layer,x,y,side,skip){
  const W=canvas.width, L=(x-cx)*z*W+W/2,T=(y-cy)*z*W+W/2,S=side*z*W;
  if(L>W||L+S<0||T>W||T+S<0)return;
  const low=image(name,layer.preview);
  if(low)ctx.drawImage(low,L,T,S,S);
  if(S<=1800)return;
  const n=layer.grid,cell=S/n;
  const left=clip(Math.floor(-L/cell),0,n-1),right=clip(Math.floor((W-L)/cell),0,n-1);
  const top=clip(Math.floor(-T/cell),0,n-1),bottom=clip(Math.floor((W-T)/cell),0,n-1);
  for(let r=top;r<=bottom;r++) for(let c=left;c<=right;c++){
    const i=r*n+c;if(i===skip)continue;
    const img=image(name+"/"+i,layer.tiles[i]);
    if(img)ctx.drawImage(img,L+c*cell,T+r*cell,cell+0.25,cell+0.25);
  }
}
function draw(){
  frame=0;ctx.fillStyle="#222";ctx.fillRect(0,0,canvas.width,canvas.height);
  const [r,c]=data.selected;
  drawLayer("outer",data.outer,0,0,1,r*16+c);
  drawLayer("inner"+size,data.inner[size],c/16,r/16,1/16,-1);
  elem("factor").value=Number(z.toFixed(1))+"×";
}
function setView(level,anchor=true){
  level=clip(level,0,Math.log2(16*size));z=2**level;slider.value=level;
  if(anchor){
    const [r,c]=data.selected,[ir,ic]=data.inner[size].example;
    const mix=clip((level-4)/Math.log2(size),0,1);
    cx=(c+.5+mix*((ic+.5)/size-.5))/16;
    cy=(r+.5+mix*((ir+.5)/size-.5))/16;
  }
  cx=clip(cx,.5/z,1-.5/z);cy=clip(cy,.5/z,1-.5/z);requestDraw();
}
function moveTo(level){
  cancelAnimationFrame(travel);const start=Math.log2(z), t0=performance.now();
  function step(t){const f=clip((t-t0)/1100,0,1);setView(start+(level-start)*f*f*(3-2*f));if(f<1)travel=requestAnimationFrame(step);}
  travel=requestAnimationFrame(step);
}
slider.oninput=()=>{cancelAnimationFrame(travel);setView(Number(slider.value))};
grid.onchange=()=>{cancelAnimationFrame(travel);size=Number(grid.value);slider.max=Math.log2(16*size);setView(Math.min(+slider.value,+slider.max))};
elem("iron").onclick=()=>moveTo(0);elem("spider").onclick=()=>moveTo(4);elem("cap").onclick=()=>moveTo(Math.log2(16*size));
canvas.addEventListener("wheel",e=>{e.preventDefault();cancelAnimationFrame(travel);setView(Math.log2(z)-.002*e.deltaY)},{passive:false});
canvas.onpointerdown=e=>{cancelAnimationFrame(travel);drag=[e.clientX,e.clientY,cx,cy];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const s=canvas.getBoundingClientRect().width*z;cx=drag[2]-(e.clientX-drag[0])/s;cy=drag[3]-(e.clientY-drag[1])/s;setView(Math.log2(z),false)};
canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
grid.value="8";setView(0);
</script></html>
